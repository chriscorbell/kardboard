# kardboard stack for minicore. Copy this directory to chriscorbell/stacks/kardboard and run
# `docker compose up -d`. Watchtower updates app, runner, egress, and preview-router on each push
# to main; session and preview containers carry the opt-out label and are managed by the runner.
#
# Networks: `control` carries app <-> runner <-> egress traffic. `workload` is the list of services
# a session container may reach — app (MCP) and egress, never the runner — but no session container
# joins it: the runner gives each session a network of its own and connects those same services to
# it, so two sessions cannot see each other. `preview` is where the router that fronts previews
# lives; the runner gives each preview a network of its own and connects the router to it, so
# branch-controlled code reaches the internet and nothing else on this stack, other previews included.
#
# Session and preview bridges are named `cbn*` so one host firewall rule can keep both kinds of
# container off the LAN; run `deploy/network-isolation.sh apply` on minicore, see
# `docs/runbooks/network-isolation.md`. Changing the preview bridge name needs the network
# recreated: `docker compose down && docker compose up -d`.

name: kardboard

services:
  app:
    image: ghcr.io/chriscorbell/kardboard-app:latest
    restart: unless-stopped
    init: true
    ports:
      - "3070:3070"
    environment:
      TZ: America/New_York
      KARDBOARD_AUTH: clerk
      KARDBOARD_PUBLIC_URL: https://kardboard.cc
      KARDBOARD_REDIRECT_HOSTS: cardboard.xode.cc,app.kardboard.cc
      KARDBOARD_ADMIN_EMAIL: ${KARDBOARD_ADMIN_EMAIL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      KARDBOARD_EMAIL_FROM: "Milo <milo@kardboard.cc>"
      KARDBOARD_RUNNER_URL: http://runner:3071
      KARDBOARD_RUNNER_TOKEN: ${KARDBOARD_RUNNER_TOKEN}
      # Only to read which Providers are out of usage, for fallback. No Session traffic comes here.
      KARDBOARD_EGRESS_URL: http://egress:8787
      GITHUB_SESSIONS_APP_ID: ${GITHUB_SESSIONS_APP_ID}
      GITHUB_SESSIONS_APP_SLUG: ${GITHUB_SESSIONS_APP_SLUG}
      GITHUB_SESSIONS_APP_PRIVATE_KEY_B64: ${GITHUB_SESSIONS_APP_PRIVATE_KEY_B64}
      GITHUB_MERGE_APP_ID: ${GITHUB_MERGE_APP_ID}
      GITHUB_MERGE_APP_SLUG: ${GITHUB_MERGE_APP_SLUG}
      GITHUB_MERGE_APP_PRIVATE_KEY_B64: ${GITHUB_MERGE_APP_PRIVATE_KEY_B64}
      # Signs Preview cookies; the preview-router below verifies with the same secret.
      KARDBOARD_PREVIEW_SECRET: ${KARDBOARD_PREVIEW_SECRET}
      # Route `kardboard.cc` to port 3070 and `*.kardboard.cc` to port 3073.
      # The first-level wildcard covers card previews with free Universal SSL.
      KARDBOARD_PREVIEW_HOST_PATTERN: ${KARDBOARD_PREVIEW_HOST_PATTERN}
      # Each verified snapshot, and every new attachment, is copied here as well: the NAS share,
      # so a lost data disk does not take the backups with it. See docs/runbooks/backups.md.
      KARDBOARD_BACKUP_COPY_DIR: /nas/backup/minicore/kardboard
    volumes:
      - ../../data/kardboard/app:/data
      # `/nas`, the plain directory holding the host's NAS automount points, never a share itself:
      # binding an automount point whose NAS is unreachable fails the container's start with "no such
      # device" (tried on minicore, 2026-09-24), which would take the app down on any redeploy while
      # the NAS is off. With `rslave`, reading `/nas/backup` inside the container mounts the share on
      # the host when it can, and it appears here. While it cannot, the copy directory has no
      # `.kardboard-backup-target`, so the app copies nothing and alerts the Admin.
      - type: bind
        source: /nas
        target: /nas
        bind:
          propagation: rslave
    networks: [control, workload]
    # /healthz reads the database and answers 503 when it cannot. The runner and the egress proxy
    # are reported in its body but never fail it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3070/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  runner:
    image: ghcr.io/chriscorbell/kardboard-runner:latest
    restart: unless-stopped
    init: true
    environment:
      KARDBOARD_RUNNER_TOKEN: ${KARDBOARD_RUNNER_TOKEN}
      KARDBOARD_APP_URL: http://app:3070
      KARDBOARD_MCP_URL: http://app:3070/mcp
      KARDBOARD_EGRESS_URL: http://egress:8787
      KARDBOARD_WORKLOAD_NETWORK: kardboard_workload
      KARDBOARD_PREVIEW_NETWORK: kardboard_preview
      # `per-session` gives every session its own bridge; `shared` puts them all back on
      # kardboard_workload together, which is only for backing the isolation out in a hurry.
      KARDBOARD_SESSION_NETWORK: ${KARDBOARD_SESSION_NETWORK:-per-session}
      KARDBOARD_LOG_DIR: /data/logs
      # Set once the egress proxy below holds the Codex sign-in file; then Session containers get
      # no Codex credential of their own. Leave empty to fall back to mounting the file into them.
      KARDBOARD_CODEX_VIA_EGRESS: ${KARDBOARD_CODEX_VIA_EGRESS:-}
      # A path on the Docker host, not in this container: the runner only names it in a bind.
      CODEX_AUTH_FILE: ${KARDBOARD_CODEX_AUTH_FILE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../data/kardboard/runner:/data
    networks: [control]
    # The runner's /healthz pings the Docker daemon and answers 503 when it cannot reach it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3071/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  egress:
    image: ghcr.io/chriscorbell/kardboard-egress:latest
    restart: unless-stopped
    init: true
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # A path in this container. The whole directory is mounted, not the one file, because the
      # proxy replaces the file when it refreshes the access token and a rename needs the directory.
      CODEX_AUTH_FILE: ${KARDBOARD_CODEX_AUTH_FILE:+/secrets/codex-auth.json}
      # Guards /limits, which the app reads to decide a Provider fallback. Session containers reach
      # this proxy too and do not hold the runner token, which is why it is reused here.
      EGRESS_CONTROL_TOKEN: ${KARDBOARD_RUNNER_TOKEN}
    volumes:
      - ../../data/kardboard/secrets:/secrets
    networks: [control, workload]
    # Up, and which credentials are loaded, as booleans; a missing one does not fail the check.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  preview-router:
    image: ghcr.io/chriscorbell/kardboard-preview-router:latest
    restart: unless-stopped
    init: true
    ports:
      - "3073:3072"
    environment:
      KARDBOARD_APP_URL: http://app:3070
      KARDBOARD_PUBLIC_URL: https://kardboard.cc
      KARDBOARD_RUNNER_TOKEN: ${KARDBOARD_RUNNER_TOKEN}
      KARDBOARD_PREVIEW_SECRET: ${KARDBOARD_PREVIEW_SECRET}
    networks: [control, preview]
    # Answered before any host routing, so it checks the process and nothing behind it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3072/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  control:
  workload:
    name: kardboard_workload
  preview:
    name: kardboard_preview
    driver_opts:
      com.docker.network.bridge.name: cbnprev
