# kardboard stack for minicore. Copy this directory to hosts/minicore/stacks/kardboard in chriscorbell/fleet and run
# `docker compose up -d`. Watchtower updates the app on each push to main.

name: kardboard

# Docker keeps every container's output under /var/lib/docker on the root disk and, by default, lets
# it grow without end. The app gets a small, rotated log; it also writes its own capped daily log
# files under /data/logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    image: ghcr.io/chriscorbell/kardboard-app:latest
    restart: unless-stopped
    init: true
    ports:
      - "3070:3070"
    environment:
      TZ: America/New_York
      KARDBOARD_AUTH: clerk
      KARDBOARD_PUBLIC_URL: https://kardboard.cc
      KARDBOARD_REDIRECT_HOSTS: cardboard.xode.cc,app.kardboard.cc
      KARDBOARD_ADMIN_EMAIL: ${KARDBOARD_ADMIN_EMAIL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      KARDBOARD_EMAIL_FROM: "Milo <milo@kardboard.cc>"
      # Each verified snapshot, and every new attachment, is copied here as well: the NAS share,
      # so a lost data disk does not take the backups with it. See docs/runbooks/backups.md.
      KARDBOARD_BACKUP_COPY_DIR: /nas/kardboard
    volumes:
      - /home/chris/docker/data/kardboard/app:/data
      # `/srv/kardboard-nas`, a plain directory on the host holding one automount point, `kardboard`,
      # which /etc/fstab mounts from `backup/minicore/kardboard` on the NAS and nothing wider: the app
      # reaches its own backup folder, not the rest of the backup share or the media share. The
      # parent is bound rather than the automount point itself, because binding an automount point
      # whose NAS is unreachable fails the container's start with "no such device" (tried on minicore,
      # 2026-09-24), which would take the app down on any redeploy while the NAS is off. With
      # `rslave`, reading `/nas/kardboard` inside the container mounts the share on the host when it
      # can, and it appears here. While it cannot, the copy directory has no
      # `.kardboard-backup-target`, so the app copies nothing and alerts the Admin.
      - type: bind
        source: /srv/kardboard-nas
        target: /nas
        bind:
          propagation: rslave
    # Far above what the app uses (tens of MB at rest), so only a runaway is stopped, and the host's
    # other stacks keep their memory.
    mem_limit: 1g
    pids_limit: 256
    logging: *logging
    # /healthz reads the database and answers 503 when it cannot.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3070/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
