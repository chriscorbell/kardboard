# The workflows pin every action to a commit, so a moved tag cannot change what runs. This keeps the
# pins current: once a week it proposes newer ones in a single pull request, naming each release in
# the comment beside its pin. A new major version changes what an action does and is a decision to
# make on purpose, so only minor and patch releases are proposed. npm packages are left out until
# Dependabot's pnpm 11 support settles, and base images too: they are floating tags such as
# node:24-alpine, which every image build already takes the newest patch of, so all Dependabot could
# propose for them is a new Node or Ubuntu major.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
