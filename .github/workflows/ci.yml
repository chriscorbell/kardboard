# Deployment contract: a push to main publishes the app image to GHCR, tagged :latest and :sha, when
# its inputs changed since the last run on main that succeeded. Watchtower on minicore polls GHCR
# every 60 s and restarts the app when its image moved, so a push of documentation restarts nothing.
# Pull requests build the image without pushing, so a broken Dockerfile fails before it reaches main.
# Running the workflow by hand on main publishes it whatever changed. Roll back by pinning a :sha tag
# in the compose file or re-running this job from an older commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless. A run on main is publishing images,
# and cancelling it halfway would leave some published and some not, so it finishes and the next waits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a commit, with the release it came from beside it, because a tag can be
# moved to other code at any time and publish runs with a token that can push the images Watchtower
# deploys. Dependabot proposes newer pins in one weekly pull request; merging one republishes the
# image, since this file is one of its inputs.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @kardboard/app build

  # Which images this run builds, as the publish job's matrix: the app's, or none. A pull request or a
  # manual run takes it. A push to main takes it when its inputs differ between this commit and the
  # head of the last run on main that succeeded, whose image was therefore published. That, and not
  # the commit before this push, is the baseline: a run that failed, or a queued run that a newer push
  # replaced, published nothing, and its changes are still owed. A push that changes none of its
  # inputs takes none, and publish is skipped. It stays a matrix so another image is one entry away.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To find the last run that succeeded.
      actions: read
    outputs:
      images: ${{ steps.pick.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The baseline commit, and whether it is an ancestor of this one, need the history.
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          IMAGES: >-
            [{"name": "app", "dockerfile": "packages/app/Dockerfile"}]
        run: |
          set -euo pipefail
          all="app"
          # The matrix entries named in a space-separated list, once each and in IMAGES order.
          pick() { jq -c --arg names "$1" '($names | split(" ")) as $wanted | [.[] | select(.name as $n | $wanted | index($n))]' <<< "$IMAGES"; }
          publish() {
            echo "Images to build: $(jq -r 'map(.name) | join(" ") | if . == "" then "none" else . end' <<< "$1")"
            echo "images=$1" >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT" != "push" ]; then
            publish "$(pick "$all")"
            exit 0
          fi
          # The run of this workflow on main that most recently started and succeeded, from a push or a
          # manual run, so a re-run of an older commit as a rollback becomes the baseline; a pull
          # request from a fork's own main branch would also match the branch filter.
          base=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=30" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | sort_by(.run_started_at) | last | .head_sha // empty') || base=""
          # No such run, or one whose commit a force push has left off main's history: there is
          # nothing trustworthy to compare with, so everything is built.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$base" "$SHA"; then
            echo "No earlier successful run on main to compare with${base:+ (${base} is not an ancestor)}."
            publish "$(pick "$all")"
            exit 0
          fi
          echo "Comparing with ${base}, the last commit on main whose run succeeded."

          # A plain assignment, so a failed diff stops the job instead of reading as "nothing changed".
          # Without rename detection a moved file is listed at both paths, so moving one out of an
          # image's directory still rebuilds that image.
          changed=$(git diff --no-renames --name-only "$base" "$SHA")
          # What goes into the image, read from its Dockerfile's COPY lines: the root lockfile and
          # workspace files, the shared package, and the app.
          names=""
          while IFS= read -r file; do
            case "$file" in
              pnpm-lock.yaml | pnpm-workspace.yaml | package.json | .npmrc | tsconfig.base.json | .dockerignore | .github/workflows/ci.yml | packages/shared/*) names="$names $all" ;;
              packages/app/*) names="$names app" ;;
            esac
          done <<< "$changed"
          publish "$(pick "$names")"

  # Anything other than main only proves the Dockerfile builds. A pull request is code nobody has
  # merged yet, so this job's token can read the repository and do nothing else: no registry login, and the token is not left in the checkout the build can read.
  # Publishing lives in its own job below, because a job's permissions cannot depend on the event.
  build:
    needs: [changes]
    if: needs.changes.outputs.images != '[]' && !(github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64
          # Reads main's layer cache but never writes to it, so these builds cannot crowd main's
          # layers out of the repository's cache allowance.
          cache-from: type=gha,scope=${{ matrix.name }}

  # Only main publishes, and only after validate passed.
  publish:
    needs: [validate, changes]
    if: needs.changes.outputs.images != '[]' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kardboard-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
