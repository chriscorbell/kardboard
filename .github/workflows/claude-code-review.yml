name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Nothing by default. The job below declares its own permissions, which replace these rather than
# add to them, so this only keeps a job added later from starting with the repository's default token.
permissions: {}

jobs:
  claude-review:
    # Not for Dependabot's pull requests: the action refuses a run started by a bot and fails the
    # check, and Dependabot's runs get none of the repository's secrets anyway. A person's push to
    # such a branch is reviewed as usual.
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Run the main agent and every subagent on Opus 5.5 at xhigh effort. The code-review plugin
          # asks for haiku, sonnet, and opus subagents; forcing the subagent model overrides those, and
          # subagents inherit the session's effort.
          claude_args: '--model claude-opus-5-5 --effort xhigh --allowedTools "mcp__github_inline_comment__create_inline_comment"'
          settings: |
            {
              "env": {
                "CLAUDE_CODE_SUBAGENT_MODEL": "claude-opus-5-5",
                "CLAUDE_CODE_SUBAGENT_MODEL_FORCE": "1"
              }
            }
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

